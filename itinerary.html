    function copyText(text, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const toast = document.getElementById('toast');
      toast.textContent = `✅ 已複製：${label || text}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);

    // Default to Day 1 (10/8 Thu) so vacation itinerary opens immediately, while 10/4-8 Work tab is right next to it
    let activeDayIndex = 1;
    let activeMainTab = 'schedule';

    function renderBottomNavIcons() {
      document.getElementById('nav-icon-schedule').innerHTML = renderIcon('Calendar', 19);
      document.getElementById('nav-icon-booking').innerHTML = renderIcon('Ticket', 19);
      document.getElementById('nav-icon-outlet').innerHTML = renderIcon('ShoppingBag', 19);
      document.getElementById('nav-icon-tips').innerHTML = renderIcon('Shield', 19);
    }

    function renderDayTabs() {
      const bar = document.getElementById('day-tabs-bar');
      if (activeMainTab !== 'schedule') {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      bar.innerHTML = SCHEDULE.map((day, idx) => {
        const isActive = idx === activeDayIndex;
        return `
          <button
            onclick="selectDay(${idx})"
            class="day-tab-btn ${isActive ? 'active' : ''}"
            id="day-tab-${idx}"
          >
            <div style="font-size:11px;text-transform:uppercase;margin-bottom:2px;letter-spacing:0.02em;">${day.dateLabel}</div>
            <div style="font-size:13px;">${day.dayLabel}</div>
            ${isActive ? '<div class="day-tab-indicator"></div>' : ''}
          </button>
        `;
      }).join('');
    }

    function selectDay(idx) {
      activeDayIndex = idx;
      renderDayTabs();
      renderMainContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      const btn = document.getElementById(`day-tab-${idx}`);
      if (btn && btn.scrollIntoView) {
        btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function switchMainTab(tab) {
      activeMainTab = tab;
      ['schedule', 'booking', 'outlet', 'tips'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (btn) {
          if (t === tab) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });
      renderDayTabs();
      renderMainContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
